# Build dependencies pinned for the target. Tracked in-repo; not a
# per-machine override. Anyone running the cijoe tasks builds against
# exactly these refs.

[xnvme]
build_dir = "/tmp/xnvme-build"

# Temporary fork: adds the `.mem_map`/`.mem_unmap` hooks and CUDA BAR1
# `device_pagesize` handling that the aisio register path needs, plus the
# PRP page-count fix that lets PRP1 carry a sub-page buffer offset. Revert
# to upstream `xnvme/xnvme` once xnvme/xnvme#663, safl/upcie#25, and
# safl/upcie#27 land upstream (upcie is vendored under xNVMe's
# toolbox/third-party).
[xnvme.repository]
remote = "https://github.com/fmma/xnvme"
ref = "f38c6b51efef531ee53f5ef05bcdc699f186ce1a"
path = "/root/xnvme"

[xal]
build_dir = "/tmp/xal-build"

# Transitive dep of fil; fil's meson.build requires xal == 0.2.0.
[xal.repository]
remote = "https://github.com/xnvme/xal"
ref = "v0.2.0"
path = "/root/xal"

[fil]
build_dir = "/tmp/fil-build"

# Fork pin: adds the `opends` backend that drives OpenDS aisio through
# fs_mock. Revert to upstream xnvme/fil once the OpenDS-aware bench
# backend lands upstream.
[fil.repository]
remote = "https://github.com/fmma/fil"
ref = "39cfad77e0c2cc6285c53fa3a1528fac82424ef5"
path = "/root/fil"
