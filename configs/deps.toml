# Build dependencies pinned for the target. Tracked in-repo; not a
# per-machine override. Anyone running the cijoe tasks builds against
# exactly these refs.

[xnvme]
build_dir = "/tmp/xnvme-build"

# Temporary fork: adds the `.mem_map`/`.mem_unmap` hooks and CUDA BAR1
# `device_pagesize` handling that the aisio register path needs, plus the
# PRP page-count fix that lets PRP1 carry a sub-page buffer offset, and the
# upcie attach mode (XNVME_UPCIE_ATTACH) that drives I/O qpairs handed out
# by a HOMI-owned controller. Branch feat/upcie-qpair-attach stacks the
# attach work on the aisio-pinned base. Revert to upstream `xnvme/xnvme`
# once the relevant changes land upstream (upcie is vendored under xNVMe's
# toolbox/third-party).
[xnvme.repository]
remote = "https://github.com/fmma/xnvme"
ref = "feat/upcie-qpair-attach"
path = "/root/xnvme"

[xal]
build_dir = "/tmp/xal-build"

# Pinned at xal main (past v0.2.0) because HOMI needs the "xal state in
# POSIX shared memory" feature (xal_from_pools and the inode/extent/dirty
# pools that homic maps) and the include-guard fix in libxal.h that lets
# a translation unit pull libxal.h both directly and via homi headers.
# fil's opends path no longer uses xal and now requires xal >=0.2.0, so
# it builds against this same pin; it is still bench-only and set up
# separately (see scripts/setup_deps.py).
[xal.repository]
remote = "https://github.com/xnvme/xal"
ref = "7bd3203fee406e66711090ad836653f326cb787a"
path = "/root/xal"

[fil]
build_dir = "/tmp/fil-build"

# Fork pin: the `opends` backend reads files on the HOMI/qublk mount via
# the OpenDS file API (like gds), enumerating with readdir. Revert to
# upstream xnvme/fil once the OpenDS-aware bench backend lands upstream.
[fil.repository]
remote = "https://github.com/fmma/fil"
ref = "feat/opends-homi"
path = "/root/fil"

[homi]
build_dir = "/tmp/homi-build"

# HOMI daemon (homid) and client (libhomic). Owns the userspace NVMe
# controller and serves I/O qpairs plus xal extent trees. Depends on
# installed xal and xnvme. Pinned at the fork's main tip for the M0
# build skeleton; bumped to the integration branch once the
# qpair-handout work lands.
[homi.repository]
remote = "https://github.com/fmma/homi"
ref = "feat/qpair-owner"
path = "/root/homi"

[qublk]
build_dir = "/tmp/qublk-build"

# qublk ublk server. Exposes the NVMe drive as /dev/ublkb0 through the
# ublk interface. Depends on installed xnvme plus liburing and the ublk
# kernel headers. Pinned at the fork's main tip for the M0 build
# skeleton; bumped to the integration branch once the HOMI-qpair attach
# path lands.
[qublk.repository]
remote = "https://github.com/fmma/qublk"
ref = "feat/homi-qpair"
path = "/root/qublk"
