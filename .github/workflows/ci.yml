# SPDX-License-Identifier: BSD-3-Clause
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the version in the tree
        run: |
          meson=$(sed -n "s/^ *version *: *'\(.*\)',/\1/p" meson.build)
          python=$(sed -n 's/^version *= *"\(.*\)"/\1/p' python/pyproject.toml)
          [ "$meson" = "$python" ] ||
            { echo "meson.build says $meson, python/pyproject.toml says $python" >&2; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || [ "v$meson" = "$GITHUB_REF_NAME" ] ||
            { echo "tag $GITHUB_REF_NAME on version $meson" >&2; exit 1; }
      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends clang-format
      - run: scripts/lint_check.py

  test-ref:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install meson and pytest
        run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends meson ninja-build python3-pytest
      - run: meson setup build
      - run: meson compile -C build
      - name: Run ref tests
        run: |
          ./build/test_smoke_ref
          mkdir -p build/testdir
          ./build/test_sync_read_prep build/testdir/sync_read_pattern.bin
          ./build/test_sync_read_ref build/testdir/sync_read_pattern.bin
      - name: Run python binding tests
        run: python3 -m pytest tests
        working-directory: python

  test-full:
    if: success() && (github.ref_type == 'tag' || contains(github.event.pull_request.labels.*.name, 'test-full'))
    needs: [lint, test-ref]
    uses: ./.github/workflows/run-on-nvme-cuda.yml
    with:
      name: test-full
      run: scripts/run_tests.py
      teardown: tasks/test.yaml clean_test_dir homi_stack_down
      timeout-minutes: 1560

  bench:
    if: "!cancelled() && needs.lint.result == 'success' && needs.test-ref.result == 'success' && needs.test-full.result != 'failure' && contains(github.event.pull_request.labels.*.name, 'bench')"
    needs: [lint, test-ref, test-full]
    uses: ./.github/workflows/run-on-nvme-cuda.yml
    with:
      name: bench
      run: scripts/bench/run.py --suite opends --io-threads 2
      teardown: tasks/bench_opends.yaml homi_stack_down cpu_governor_restore
      report: true
      timeout-minutes: 1500

  bench-sweep:
    if: "!cancelled() && needs.lint.result == 'success' && needs.test-ref.result == 'success' && needs.test-full.result != 'failure' && (github.ref_type == 'tag' || contains(github.event.pull_request.labels.*.name, 'bench-sweep'))"
    needs: [lint, test-ref, test-full]
    uses: ./.github/workflows/run-on-nvme-cuda.yml
    with:
      name: bench-sweep
      run: scripts/bench/run.py --suite opends
      teardown: tasks/bench_opends.yaml homi_stack_down cpu_governor_restore
      report: true
      timeout-minutes: 2160

  bench-full-sweep:
    if: "!cancelled() && needs.lint.result == 'success' && needs.test-ref.result == 'success' && needs.test-full.result != 'failure' && contains(github.event.pull_request.labels.*.name, 'bench-full-sweep')"
    needs: [lint, test-ref, test-full]
    uses: ./.github/workflows/run-on-nvme-cuda.yml
    with:
      name: bench-full-sweep
      run: scripts/bench/run.py --suite opends --full-sweep
      teardown: tasks/bench_opends.yaml homi_stack_down cpu_governor_restore
      report: true
      timeout-minutes: 4320

  release:
    if: github.ref_type == 'tag' && needs.bench-sweep.result == 'success'
    needs: [bench-sweep]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: results-bench-sweep
          path: results
      - uses: actions/download-artifact@v4
        with:
          name: bench-sweep
          path: bench-sweep
      - name: Write the release notes
        run: |
          {
            echo "OpenDS builds from source. The pinned dependency stack:"
            echo
            awk -F'"' '/^\[/ { sub(/^\[/, ""); sub(/\..*/, ""); dep = $0 } /^ref/ { print "- " dep ": " $2 }' configs/deps.toml
            echo
            echo "The benchmark sweep of this release on the reference machine, scripts/bench/sweep.toml; results.json and the cijoe output are attached."
            echo
            cat results/report.md
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zip -qr bench-sweep-cijoe-output.zip bench-sweep
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenDS $GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" --clobber results/results.json results/report.md bench-sweep-cijoe-output.zip
