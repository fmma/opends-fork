# SPDX-License-Identifier: BSD-3-Clause
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Label events only matter for the hardware jobs; skip the rest.
    if: github.event.action != 'labeled' || github.event.label.name == 'test-full' || github.event.label.name == 'bench'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends clang-format
      - run: scripts/lint_check.py

  test-ref:
    if: github.event.action != 'labeled' || github.event.label.name == 'test-full' || github.event.label.name == 'bench'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install meson and pytest
        run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends meson ninja-build python3-pytest
      - run: meson setup build
      - run: meson compile -C build
      - name: Run ref tests
        run: |
          ./build/test_smoke_ref
          mkdir -p build/testdir
          ./build/test_sync_read_prep build/testdir/sync_read_pattern.bin
          ./build/test_sync_read_ref build/testdir/sync_read_pattern.bin
      - name: Run python binding tests
        run: python3 -m pytest tests
        working-directory: python

  # Full suite, aisio included, on a hardware target. Opt-in with the
  # test-full label, approved per run in the manual-operator
  # environment by an operator who brings up a one-shot runner (see
  # docs/ci-hw.md).
  # Do not add it to required status checks. A new push cancels a
  # superseded run, waiting or mid-suite; the always() teardown still
  # runs on a cancel.
  test-full:
    # The name is the only text shown while the job waits for
    # approval; point the contributor at the operator.
    name: test-full (contact operator to run)
    # Run when the PR carries either hardware label; bench implies
    # test-full, so a sweep never starts on a build that fails the
    # suite. An unrelated label event skips lint above, so success()
    # skips this too.
    if: >-
      success() && (
      contains(github.event.pull_request.labels.*.name, 'test-full') ||
      contains(github.event.pull_request.labels.*.name, 'bench'))
    needs: [lint, test-ref]
    runs-on: [self-hosted, test-full]
    environment: manual-operator
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install target configs
        run: cp "${OPENDS_CI_CONFIG_DIR:-$HOME/.config/opends-ci}"/{test,transport}.toml configs/
      - run: scripts/rsync.py
      - run: scripts/build.py
      - run: scripts/run_tests.py
      - name: Tear the stack down
        # test.yaml tears down as its last step, but fail_fast skips
        # it when a test fails; leave the target usable regardless.
        if: always()
        run: cijoe -m -s -o cijoe-output-teardown -c configs/transport.toml -c configs/deps.toml -c configs/test.toml tasks/test.yaml homi_stack_down

  # Standard sweep (scripts/bench/sweep.toml) on a hardware target,
  # published to the artefacts branch. Opt-in with the bench label.
  # The approval gate is inherited through test-full: the sweep only
  # starts after the approved suite passes. This job's token can write
  # repo contents (the artefacts push), and a pull_request run uses the
  # PR's own code; the operator's diff review before approval is the
  # boundary. A fork PR gets a read-only token, so the publish works
  # from same-repo branches only.
  bench:
    if: success() && contains(github.event.pull_request.labels.*.name, 'bench')
    needs: [lint, test-ref, test-full]
    runs-on: [self-hosted, test-full]
    permissions:
      contents: write
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - name: Install target configs
        run: cp "${OPENDS_CI_CONFIG_DIR:-$HOME/.config/opends-ci}"/{test,transport}.toml configs/
      - run: scripts/rsync.py
      - run: scripts/build.py
      - name: Run the standard sweep
        run: scripts/bench/run.py --suite opends
      - name: Render the report
        run: scripts/bench/report.py
      - name: Publish to the artefacts branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # The checkout is shallow and single-branch; fetch the remote
        # artefacts branch first so the snapshot extends its history
        # (|| true covers the very first publish).
        run: |
          git fetch origin +refs/heads/artefacts:refs/remotes/origin/artefacts || true
          scripts/bench/artefacts.py --push
      - name: Tear the stack down
        # run.py tears down after each config, but a cancel or timeout
        # can kill it mid-config; leave the target usable regardless.
        if: always()
        run: cijoe -m -s -o cijoe-output-teardown -c configs/transport.toml -c configs/deps.toml -c configs/test.toml tasks/bench_opends.yaml homi_stack_down cpu_governor_restore
