#
# Marks the head of a PR labeled "test-full" with a pending "test-full" commit
# status. An operator later runs the suite from their own machine and
# flips the status to success or failure (see docs/ci-hw.md). This
# workflow never checks out or executes PR code, which is why
# pull_request_target is safe here. Do not add test-full to required
# status checks; it is opt-in and must not gate merges.
name: mark-pending

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  statuses: write

jobs:
  test-full:
    # Trigger when the test-full label is added, and on pushes while
    # the label is present. Other label additions do not retrigger.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'test-full') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'test-full'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}
          -f state=pending -f context=test-full
          -f "description=waiting for an operator"
