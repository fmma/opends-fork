# SPDX-License-Identifier: BSD-3-Clause
#
# Runs the full test suite, aisio included, for a PR labeled
# "test-full". The job waits in the test-full environment until an
# operator approves it and brings up a one-shot self-hosted runner on
# a machine with access to the hardware target (see docs/ci-hw.md).
# Do not add test-full to required status checks; it is opt-in and
# must not gate merges.
name: test-full

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  test-full:
    # Trigger when the test-full label is added, and on pushes while
    # the label is present. Other label additions do not retrigger.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'test-full') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'test-full'))
    runs-on: [self-hosted, test-full]
    environment: test-full
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install target configs
        run: cp "${OPENDS_CI_CONFIG_DIR:-$HOME/.config/opends-ci}"/{test,transport}.toml configs/
      - run: scripts/rsync.py
      - run: scripts/build.py
      - run: scripts/run_tests.py
      - name: Tear the stack down
        # test.yaml tears down as its last step, but fail_fast skips
        # it when a test fails; leave the target usable regardless.
        if: always()
        run: cijoe -m -s -o cijoe-output-teardown -c configs/transport.toml -c configs/deps.toml -c configs/test.toml tasks/test.yaml homi_stack_down
