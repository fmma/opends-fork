doc: |
  Setup xal
  =========

  Clones or updates the xal repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs xal
  so its pkg-config file becomes discoverable by fil. The remote and
  ref are read from [xal.repository] in deps.toml.

  xal (eXtent Access Library) is a transitive dependency of fil; fil's
  iter walks the on-device XFS metadata via xal to enumerate the
  dataset. HOMI links it too, to index the device and to re-index on
  the client's mark-dirty request.

  The pin is upstream main, at the commit xnvme/xal#45 landed as. It is
  a commit rather than a tag because the mark-dirty support it carries
  is not in a release yet.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_xal.yaml

steps:
  - name: setup_xal
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.xal.repository.remote }}' '{{ config.xal.repository.ref }}' '{{ config.deps.src_root }}/xal' '{{ config.deps.build_root }}/xal-build'
