doc: Clone, build, and install the qublk ublk server on the target.

steps:
  - name: setup_qublk
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.qublk.repository.remote }}' '{{ config.qublk.repository.ref }}' '{{ config.deps.src_root }}/qublk' '{{ config.deps.build_root }}/qublk-build'
