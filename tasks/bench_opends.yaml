doc: |
  OpenDS Bench Suite
  ==================

  Drives filperf with the `opends` backend (raw NVMe via xNVMe
  upcie-cuda, exercised through fil's fmma fork) across the three
  reference datasets (filesize8gib, tiktokish, imagenetish).

  fil walks XAL on the unbound device to enumerate files and resolve
  extents, then registers them with OpenDS' fs_mock at setup time.
  The mount step is preserved only because the dataset directories
  must exist on the FS for setup_dataset.yaml to populate them; the
  bench itself does not depend on the FS being mounted.

  Prerequisites:
    * scripts/setup_deps.py has installed xnvme, xal, OpenDS, and fil
      on the target.
    * scripts/build.py has built OpenDS on the target.
    * aisio's tasks/setup_dataset.yaml has run on the target, formatting
      the NVMe with XFS and populating the three reference datasets
      (filesize8gib, tiktokish, imagenetish) under
      config.test.mount_point.

  bench_meta records the build commit + target platform to
  artifacts/meta.json; each bench_run stashes filperf's verbatim
  stdout to artifacts/<backend>_<data_dir>.log for downstream
  parsing by scripts/bench_report.py.

steps:
  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh'

  - name: meta
    uses: bench_meta

  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: unbind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/unbind_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: opends_filesize8gib
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1

  - name: opends_filesize8gib_async
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mode: async

  - name: opends_tiktokish
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 1
      batch-size: 26

  - name: opends_tiktokish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 1
      batch-size: 26
      mode: async

  - name: opends_imagenetish
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096

  - name: opends_imagenetish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mode: async

  - name: rebind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/rebind_nvme.sh' '{{ config.test.nvme_bdf }}'
