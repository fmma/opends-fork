doc: Clone, build, and install fil (the filperf bench binary) on the target.

steps:
  - name: setup_fil
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.fil.repository.remote }}' '{{ config.fil.repository.ref }}' '{{ config.deps.src_root }}/fil' '{{ config.deps.build_root }}/fil-build'
