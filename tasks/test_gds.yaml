doc: |
  OpenDS Test Suite (GPU Direct Storage via cuFile)
  ==================================================

  Tests GDS reads from NVMe directly into GPU memory using the cuFile
  backend. Requires an NVIDIA GPU with GDS support. The kernel NVMe
  driver remains bound because cuFile operates through the mounted
  filesystem.

  Assumes aisio's setup_dataset.yaml and setup_opends.yaml have been run.

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/test.toml \
        tasks/test_gds.yaml

steps:
  - name: bind_nvme
    run: |
      {{ config.opends.repository.path }}/tasks/steps/bind_nvme.sh {{ config.test.nvme_bdf }} {{ config.test.nvme_ns }}

  - name: mount
    run: |
      {{ config.opends.repository.path }}/tasks/steps/mount_nvme.sh {{ config.test.nvme_ns }} {{ config.test.mount_point }}

  - name: test_read_cases_gds
    run: |
      echo 3 > /proc/sys/vm/drop_caches
      {{ config.opends.build_dir }}/test_read_cases_gds {{ config.test.test_file }}
