doc: |
  OpenDS Test Suite
  ==================

  Runs all available backend tests. Reference backend tests always run.
  GDS tests run only when the GDS backend was built. aisio tests run
  when both xNVMe and CUDA were found; they require the NVMe kernel
  driver unbound from the target device, so the ref and GDS phases
  must complete first. The final rebind step restores the original
  driver binding so iterative test runs leave the target usable.

  Assumes setup_opends.yaml has been run (sync_and_build.py does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/test.yaml

steps:
  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.nvme_ns }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_ns }}' '{{ config.test.mount_point }}'

  - name: test_smoke_ref
    run: |
      '{{ config.test.build_dir }}/test_smoke_ref'

  - name: test_sync_read_prep
    run: |
      '{{ config.test.build_dir }}/test_sync_read_prep' '{{ config.test.mount_point }}/opends_sync_read_pattern.bin'

  - name: test_sync_read_ref
    run: |
      '{{ config.test.build_dir }}/test_sync_read_ref' '{{ config.test.mount_point }}/opends_sync_read_pattern.bin'

  - name: test_sync_read_gds
    run: |
      '{{ config.test.build_dir }}/test_sync_read_gds' '{{ config.test.mount_point }}/opends_sync_read_pattern.bin'

  - name: cache_extents
    run: |
      '{{ config.test.build_dir }}/cache_extents' \
        '{{ config.test.mount_point }}/opends_sync_read_pattern.bin' \
        '{{ config.test.build_dir }}/opends_extents.bin'

  - name: unbind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/unbind_nvme.sh' '{{ config.test.build_dir }}/opends_extents.bin' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: test_sync_read_aisio
    run: |
      OPENDS_EXTENT_CACHE='{{ config.test.build_dir }}/opends_extents.bin' \
        '{{ config.test.build_dir }}/test_sync_read_aisio'

  - name: rebind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/rebind_nvme.sh' '{{ config.test.build_dir }}/opends_extents.bin' '{{ config.test.nvme_bdf }}'
