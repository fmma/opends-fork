doc: |
  OpenDS Test Suite
  ==================

  Runs all available backend tests. Reference backend tests always run.
  GDS tests run only when the GDS backend was built.

  Assumes setup_opends.yaml has been run (sync_and_build.py does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/test.toml \
        tasks/test.yaml

steps:
  - name: bind_nvme
    run: |
      {{ config.opends.repository.path }}/tasks/steps/bind_nvme.sh {{ config.test.nvme_bdf }} {{ config.test.nvme_ns }}

  - name: mount
    run: |
      {{ config.opends.repository.path }}/tasks/steps/mount_nvme.sh {{ config.test.nvme_ns }} {{ config.test.mount_point }}

  - name: test_smoke_ref
    run: |
      {{ config.opends.build_dir }}/test_smoke_ref

  - name: test_sync_read_prep
    run: |
      {{ config.opends.build_dir }}/test_sync_read_prep {{ config.test.mount_point }}/opends_sync_read_pattern.bin

  - name: test_sync_read_ref
    run: |
      {{ config.opends.build_dir }}/test_sync_read_ref {{ config.test.mount_point }}/opends_sync_read_pattern.bin

  - name: test_sync_read_gds
    run: |
      echo 3 > /proc/sys/vm/drop_caches
      {{ config.opends.build_dir }}/test_sync_read_gds {{ config.test.mount_point }}/opends_sync_read_pattern.bin
