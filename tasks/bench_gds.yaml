doc: |
  GDS Bench Suite
  ===============

  Drives filperf with the `gds` backend (cuFile reference baseline)
  across the three reference datasets (filesize8gib, tiktokish,
  imagenetish). Runs while the kernel `nvme` driver owns the device.

  Prerequisites:
    * scripts/setup_deps.py has installed xnvme, xal, OpenDS, and fil
      on the target.
    * scripts/build.py has built OpenDS on the target.
    * aisio's tasks/setup_dataset.yaml has run on the target, formatting
      the NVMe with XFS and populating the three reference datasets
      (filesize8gib, tiktokish, imagenetish) under
      config.test.mount_point.

  Each filperf invocation drops page caches first so cold-cache
  numbers are measured. CSV output (Time, Batches, IOPS, MiB/s) goes
  to cijoe's report directory.

steps:
  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh'

  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.nvme_ns }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_ns }}' '{{ config.test.mount_point }}'

  - name: gds_filesize8gib
    run: |
      echo "=== gds_filesize8gib ==="
      echo 3 > /proc/sys/vm/drop_caches
      filperf '{{ config.test.nvme_ns }}' \
        --backend gds \
        --mnt '{{ config.test.mount_point }}' \
        --data-dir filesize8gib \
        --batches 1 --batch-size 1 \
        --summary

  - name: gds_tiktokish
    run: |
      echo "=== gds_tiktokish ==="
      echo 3 > /proc/sys/vm/drop_caches
      filperf '{{ config.test.nvme_ns }}' \
        --backend gds \
        --mnt '{{ config.test.mount_point }}' \
        --data-dir tiktokish \
        --batches 1 --batch-size 26 \
        --summary

  - name: gds_imagenetish
    run: |
      echo "=== gds_imagenetish ==="
      echo 3 > /proc/sys/vm/drop_caches
      filperf '{{ config.test.nvme_ns }}' \
        --backend gds \
        --mnt '{{ config.test.mount_point }}' \
        --data-dir imagenetish \
        --batches 300 --batch-size 4096 \
        --summary
