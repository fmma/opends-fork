doc: |
  Setup xNVMe
  ============

  Clones or updates the xNVMe repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs
  xNVMe so its pkg-config file becomes discoverable when building
  OpenDS. The remote and ref are read from [xnvme.repository] in
  test.toml, so the same task works against upstream xNVMe or any fork.

  The aisio backend's ds_file_buf_register path requires the
  fmma/xnvme#feat/upcie-cuda-mem-map fork which adds .mem_map and
  .mem_unmap hooks to the upcie-cuda backend; test.toml.example
  points at that fork by default.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/test.toml \
        tasks/setup_xnvme.yaml

steps:
  - name: setup_xnvme
    run: |
      '{{ config.opends.repository.path }}/tasks/steps/setup_xnvme.sh' '{{ config.xnvme.repository.remote }}' '{{ config.xnvme.repository.ref }}' '{{ config.xnvme.repository.path }}' '{{ config.xnvme.build_dir }}'
