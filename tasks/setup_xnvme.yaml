doc: |
  Setup xNVMe
  ============

  Clones or updates the xNVMe repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs
  xNVMe so its pkg-config file becomes discoverable when building
  OpenDS. The remote and ref are read from [xnvme.repository] in
  deps.toml, which pins the build dependency for the whole project.

  The pin is a commit rather than a tag because it tracks an in-flight
  upstream pull request. Upstream main stubs the upcie-cuda .mem_map
  hook to xnvme_be_nosys_mem_map, so opends_buf_register fails with
  ENOSYS. xnvme/xnvme#745 implements the hook, and the pin is its head.
  That head also resolves the CUDA registry range from the driver
  mapping; without it, registering a buffer smaller than the 2 MiB
  granule fails with EOPNOTSUPP. Move the pin to upstream once #745
  lands. The head lives on the branch the pull request is opened from,
  safl/xNVMe#upcie_registry_vendored, which must stay alive for the pin
  to remain fetchable.

  HOMI and qublk are pinned to their multi-process branches. OpenDS
  joins the group xNVMe itself shares across processes, so nothing
  hands out qpairs any more; the HOMI fork stays only for extent
  resolution, which upstream has no answer for yet.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_xnvme.yaml

steps:
  - name: setup_xnvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.xnvme.repository.remote }}' '{{ config.xnvme.repository.ref }}' '{{ config.deps.src_root }}/xnvme' '{{ config.deps.build_root }}/xnvme-build'
